services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: visual-defect-inspector-api:0.1.0
    env_file: .env
    environment:
      INSPECTION_DB_PATH: /app/data/inspections.sqlite3
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: visual-defect-inspector-web:0.1.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped