[project]
name = "visual-defect-inspector-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "google-genai>=1.0.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "reportlab>=5.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"**/__init__.py" = ["D104"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
